name: Deploy analytics Worker

# The site itself is built and hosted by Netlify from `main`; this only deploys the
# Cloudflare Worker behind score.abhinav.dev/api/collect and /stats.
# Skipped until a CLOUDFLARE_API_TOKEN repository secret exists (Workers + D1 edit on the account).
on:
  push:
    branches: [main]
    paths: ['worker/**']
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Skip when no Cloudflare token is configured
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN not set; skipping deploy."
      - uses: actions/setup-node@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker
      - name: Apply D1 migrations and deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker
        run: |
          npx wrangler d1 migrations apply overlay-analytics --remote
          npx wrangler deploy
